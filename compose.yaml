name: was-essen-wir

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wasessenwir}
      POSTGRES_USER: ${POSTGRES_USER:-wasessenwir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-wasessenwir}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-wasessenwir}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment or .env}
      TZ: ${TZ:-Europe/Berlin}
      APP_SESSION_COOKIE_SECURE: ${APP_SESSION_COOKIE_SECURE:-false}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-12h}
      APP_REMEMBER_ME_ENABLED: ${APP_REMEMBER_ME_ENABLED:-true}
      APP_REMEMBER_ME_DURATION: ${APP_REMEMBER_ME_DURATION:-P30D}
      APP_SETUP_TOKEN_TTL: ${APP_SETUP_TOKEN_TTL:-PT24H}
      APP_SETUP_ROTATE_TOKEN: ${APP_SETUP_ROTATE_TOKEN:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_ALLOW_FIXTURE: ${AI_ALLOW_FIXTURE:-false}
      AI_MAX_INPUT_LENGTH: ${AI_MAX_INPUT_LENGTH:-500}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_RATE_LIMIT_PER_USER_PER_MINUTE: ${AI_RATE_LIMIT_PER_USER_PER_MINUTE:-5}
      AI_RATE_LIMIT_PER_USER_PER_DAY: ${AI_RATE_LIMIT_PER_USER_PER_DAY:-50}
      AI_RATE_LIMIT_GLOBAL_PER_DAY: ${AI_RATE_LIMIT_GLOBAL_PER_DAY:-150}
      AI_MAX_CONCURRENT_PER_USER: ${AI_MAX_CONCURRENT_PER_USER:-1}
      AI_MAX_CONCURRENT_GLOBAL: ${AI_MAX_CONCURRENT_GLOBAL:-3}
      AI_RATE_LIMIT_MAX_TRACKED_USERS: ${AI_RATE_LIMIT_MAX_TRACKED_USERS:-1000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-30s}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30s}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
