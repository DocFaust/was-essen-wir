spring:
  application:
    name: was-essen-wir
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wasessenwir}
    username: ${SPRING_DATASOURCE_USERNAME:wasessenwir}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:12h}
      tracking-modes: cookie
      cookie:
        name: WAEW_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_SESSION_COOKIE_SECURE:false}

app:
  time-zone: ${APP_TIME_ZONE:Europe/Berlin}
  setup:
    token-ttl: ${APP_SETUP_TOKEN_TTL:PT24H}
    rotate-token: ${APP_SETUP_ROTATE_TOKEN:false}
  security:
    login-max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:8}
    login-window: ${APP_LOGIN_WINDOW:PT15M}
    setup-max-attempts: ${APP_SETUP_MAX_ATTEMPTS:8}
    setup-window: ${APP_SETUP_WINDOW:PT15M}
    attempt-limiter-max-keys: ${APP_ATTEMPT_LIMITER_MAX_KEYS:10000}
  remember-me:
    enabled: ${APP_REMEMBER_ME_ENABLED:true}
    duration: ${APP_REMEMBER_ME_DURATION:P30D}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:ollama}
    max-input-length: ${AI_MAX_INPUT_LENGTH:500}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    allow-fixture: ${AI_ALLOW_FIXTURE:false}
    rate-limit:
      per-user-per-minute: ${AI_RATE_LIMIT_PER_USER_PER_MINUTE:5}
      per-user-per-day: ${AI_RATE_LIMIT_PER_USER_PER_DAY:50}
      global-per-day: ${AI_RATE_LIMIT_GLOBAL_PER_DAY:150}
      max-concurrent-per-user: ${AI_MAX_CONCURRENT_PER_USER:1}
      max-concurrent-global: ${AI_MAX_CONCURRENT_GLOBAL:3}
      max-tracked-users: ${AI_RATE_LIMIT_MAX_TRACKED_USERS:1000}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen3.5:9b}
      timeout: ${OLLAMA_TIMEOUT:30s}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      timeout: ${OPENAI_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
