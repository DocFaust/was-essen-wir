# Öffentlicher Betrieb hinter Host-Nginx (TLS-Terminierung).
#
# Vertrauensgrenze: Nur Verbindungen aus privaten Netzen / Loopback (Host-Nginx über
# den veröffentlichten Loopback-Port) dürfen X-Forwarded-For setzen. real_ip ersetzt
# $remote_addr durch den vom Host-Nginx gesetzten Client. Anschließend wird X-Forwarded-For
# gegenüber dem Backend mit diesem Wert überschrieben.
#
# Direkte Aufrufe ohne Host-Nginx (Loopback) können Header vortäuschen – deshalb ist der
# Frontend-Port ausschließlich an 127.0.0.1 gebunden. Siehe docs/deployment.md.

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
    }

    location /api/ai/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
