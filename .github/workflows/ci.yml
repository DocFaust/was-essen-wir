name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Java 25 einrichten
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Unit- und Integrationstests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: TypeScript prüfen
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Production-Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: Chromium installieren
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke-Test gegen die isolierte Umgebung
        run: node --check scripts/e2e.mjs && node scripts/e2e.mjs

      - name: Testumgebung entfernen
        if: always()
        run: docker compose --project-name was-essen-wir-e2e -f deploy/compose.yaml down --volumes --remove-orphans

      - name: Screenshots und Traces hochladen
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Compose-Konfiguration validieren
        env:
          POSTGRES_DB: wasessenwir
          POSTGRES_USER: wasessenwir
          POSTGRES_PASSWORD: ci-validation-only
          APP_PORT: "8080"
        run: docker compose -f deploy/compose.yaml config --quiet

  arm64:
    name: ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Stack nativ auf ARM64 starten
        run: |
          set -euo pipefail
          export POSTGRES_DB=wasessenwir
          export POSTGRES_USER=wasessenwir
          export POSTGRES_PASSWORD="$(openssl rand -hex 18)"
          export APP_PORT=18080
          cleanup() {
            docker compose --project-name was-essen-wir-arm -f deploy/compose.yaml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose --project-name was-essen-wir-arm -f deploy/compose.yaml up --build --detach --wait --wait-timeout 600
          curl -fsS "http://127.0.0.1:${APP_PORT}/api/status" | grep -q '"application":"was-essen-wir"'
